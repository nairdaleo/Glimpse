name: Promote release candidate

# Publishes a tested pre-release as the final release: the identical,
# already notarized DMG is re-attached under vX.Y.Z at the rc's commit, and
# the Sparkle appcast on main is updated so existing installs see it.
on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Release candidate tag to promote, e.g. v0.3.0-rc.2"
        required: true

permissions:
  contents: write # create the release and commit appcast.xml

concurrency:
  group: promote

jobs:
  promote:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RC_TAG: ${{ inputs.rc_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate input and secrets
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ "$RC_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "::error::rc_tag must look like v0.3.0-rc.1"; exit 1; }
          [[ -n "$SPARKLE_KEY" ]] || { echo "::error::Missing SPARKLE_ED_PRIVATE_KEY. See docs/releasing.md."; exit 1; }
          FINAL="${RC_TAG%-rc.*}"
          echo "FINAL=$FINAL" >> "$GITHUB_ENV"
          echo "VERSION=${FINAL#v}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Check the candidate
        run: |
          gh release view "$RC_TAG" --json isPrerelease --jq .isPrerelease | grep -q true \
            || { echo "::error::$RC_TAG is not a published pre-release."; exit 1; }
          if gh release view "$FINAL" >/dev/null 2>&1; then echo "::error::$FINAL already exists."; exit 1; fi
          echo "COMMIT=$(git rev-list -n 1 "$RC_TAG")" >> "$GITHUB_ENV"
      - name: Fetch the notarized DMG
        run: |
          mkdir -p release
          gh release download "$RC_TAG" --pattern '*.dmg' --dir release
          mv release/*.dmg "release/Glimpse-$VERSION.dmg"
          xcrun stapler validate "release/Glimpse-$VERSION.dmg"
          (cd release && shasum -a 256 "Glimpse-$VERSION.dmg" > "Glimpse-$VERSION.dmg.sha256")
      - name: Publish release
        run: |
          gh release create "$FINAL" --target "$COMMIT" --generate-notes --latest \
            --title "Glimpse $VERSION" \
            "release/Glimpse-$VERSION.dmg" "release/Glimpse-$VERSION.dmg.sha256"
      - name: Update appcast.xml
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          swift package resolve
          cp appcast.xml release/appcast.xml
          rm release/*.sha256
          printf '%s' "$SPARKLE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$FINAL/" \
            --link "https://tastyjam.ca/glimpse/" \
            release
          cp release/appcast.xml appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "release: appcast for Glimpse $VERSION"
          git push origin HEAD:main
      # Homebrew cask bump: see issue #15.
