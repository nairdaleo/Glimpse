name: App Store upload

# Builds the sandboxed Mac App Store edition from a release tag and uploads it
# to App Store Connect, where it appears under TestFlight and can be attached
# to a version for review. Submitting for review stays a manual step.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.3.0 or v0.3.0-rc.2"
        required: true

permissions:
  contents: write # push the upload tag

concurrency:
  group: app-store

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate input and secrets
        env:
          P12: ${{ secrets.MAS_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAS_CERTS_P12_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::tag must look like v0.3.0 or v0.3.0-rc.1"; exit 1; }
          missing=()
          for name in P12 P12_PASSWORD PROFILE ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing App Store secrets (${missing[*]}). See docs/releasing.md."
            exit 1
          fi
          version="${TAG#v}"
          echo "VERSION=${version%-rc.*}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Tests
        run: swift test
      - name: Import distribution certificates into a temporary keychain
        env:
          P12: ${{ secrets.MAS_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAS_CERTS_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/appstore.keychain-db"
          password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
          security find-identity -v "$keychain" | grep -q "3rd Party Mac Developer Installer" \
            || { echo "::error::The .p12 has no Mac Installer Distribution identity."; exit 1; }
      - name: Build, sign, package and upload
        env:
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export PROVISIONING_PROFILE="$RUNNER_TEMP/Glimpse.provisionprofile"
          echo "$PROFILE" | base64 --decode > "$PROVISIONING_PROFILE"
          export ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_PRIVATE_KEY_PATH"
          UPLOAD=1 scripts/make-pkg.sh
      - name: Tag the uploaded build
        run: |
          build="$(git rev-list --count HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION-build$build" -m "App Store Connect upload: Glimpse $VERSION ($build)"
          git push origin "v$VERSION-build$build"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/appstore.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/Glimpse.provisionprofile"
