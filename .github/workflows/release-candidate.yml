name: Release candidate

# Pushing a tag like v0.3.0-rc.1 builds, signs, notarizes and attaches a
# universal DMG to a GitHub pre-release. Promote it with promote-release.yml.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: write # create the pre-release

concurrency:
  group: release-${{ github.ref }}

jobs:
  rc:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Require signing secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          for name in P12 P12_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release secrets (${missing[*]}). See docs/releasing.md; an unsigned DMG is never published."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version from tag
        run: echo "VERSION=${TAG#v}" | sed 's/-rc\.[0-9]*$//' >> "$GITHUB_ENV"
      - name: Tests
        run: swift test
      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" \
            || { echo "::error::The certificate is not a Developer ID Application identity."; exit 1; }
      - name: Build, sign, notarize and staple the DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          export ASC_PRIVATE_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$ASC_PRIVATE_KEY_PATH"
          scripts/make-dmg.sh
          mv "build/Glimpse-$VERSION.dmg" "build/Glimpse-${TAG#v}.dmg"
          (cd build && shasum -a 256 "Glimpse-${TAG#v}.dmg" > "Glimpse-${TAG#v}.dmg.sha256")
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --prerelease --verify-tag --generate-notes \
            --title "Glimpse ${TAG#v}" \
            "build/Glimpse-${TAG#v}.dmg" "build/Glimpse-${TAG#v}.dmg.sha256"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
