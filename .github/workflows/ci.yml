name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel: the shipped DMG is universal.
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # build numbers are the commit count
      - name: Toolchain
        run: swift --version && uname -m && sw_vers
      - name: Unit, reader and rendering tests
        run: swift test
      - name: Universal app bundle
        run: ARCH=universal ./scripts/build-app.sh
      - name: Native reader diagnostic on the runner
        # Exercises the real CPU/memory/disk/network/battery readers; virtual
        # runners have no battery, which the reader reports as unavailable.
        run: build/Glimpse.app/Contents/MacOS/Glimpse --diagnose
      - name: Card renders for visual review
        run: GLIMPSE_RENDER_ARTIFACTS="$RUNNER_TEMP/cards" swift test --filter MetricCardRenderingTests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: card-renders-${{ matrix.runner }}
          path: ${{ runner.temp }}/cards
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal-account repos need no GITLEAKS_LICENSE.
